<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebUI Auto-Rigger & Motion Library</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { display: flex; height: 100vh; background-color: #121212; color: #ffffff; overflow: hidden; }
        
        #sidebar { width: 340px; background: #1e1e1e; padding: 20px; display: flex; flex-direction: column; gap: 15px; border-right: 1px solid #333; z-index: 10; overflow-y: auto; }
        h2 { color: #4CAF50; font-size: 1.2rem; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 0.85rem; color: #aaa; }
        input[type="file"] { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #333; background: #222; color: #fff; }
        button { width: 100%; padding: 12px; background: #4CAF50; border: none; font-weight: bold; color: white; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #45a049; }
        
        .anim-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .anim-btn { background: #2a2a2a; border: 1px solid #444; font-size: 0.85rem; padding: 10px; font-weight: normal; }
        .anim-btn:hover { background: #4CAF50; border-color: #4CAF50; }

        #status { font-size: 0.8rem; padding: 10px; border-radius: 4px; background: #222; color: #bbb; word-break: break-all; }
        .success { color: #4CAF50 !important; }
        .error { color: #f44336 !important; }

        #canvas-container { flex: 1; position: relative; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Auto-Rigger & Motion UI</h2>
        
        <!-- 1. Upload Karakter Mesh -->
        <div class="input-group">
            <label for="charFile">1. Upload Karakter (.glb / .gltf)</label>
            <input type="file" id="charFile" accept=".glb, .gltf" onchange="uploadCharacter(event)">
        </div>

        <hr style="border-color: #333;">

        <!-- 2. Library Animasi Vercel -->
        <div class="input-group">
            <label>2. Library Animasi Auto-Retarget</label>
            <div class="anim-grid">
                <button class="anim-btn" onclick="fetchAndApplyAnimation('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/RobotExpressive/RobotExpressive.glb', 'Walking')">🚶 Walk</button>
                <button class="anim-btn" onclick="fetchAndApplyAnimation('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/RobotExpressive/RobotExpressive.glb', 'Running')">🏃 Run</button>
                <button class="anim-btn" onclick="fetchAndApplyAnimation('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/RobotExpressive/RobotExpressive.glb', 'Dance')">💃 Dance</button>
                <button class="anim-btn" onclick="resetToTPose()">🧍 Reset T-Pose</button>
            </div>
        </div>

        <hr style="border-color: #333;">

        <!-- 3. Player Controls -->
        <div class="input-group">
            <label>3. Controls</label>
            <button onclick="togglePlayPause()" style="background: #2196F3;">⏯ Play / Pause</button>
        </div>

        <div id="status">Status: Silakan upload karakter Kobold/Mike kamu.</div>
    </div>

    <div id="canvas-container"></div>

    <script>
        // --- THREE.JS ENGINE SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
        camera.position.set(0, 1.2, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0.9, 0);
        controls.update();

        // Lighting & Grid
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(3, 10, 5);
        scene.add(dirLight);

        const gridHelper = new THREE.GridHelper(10, 10, 0x444444, 0x222222);
        scene.add(gridHelper);

        let mixer = null;
        let characterModel = null;
        let isPlaying = true;
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (mixer && isPlaying) mixer.update(delta);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // --- 1. UPLOAD CHARACTER ---
        function uploadCharacter(event) {
            const file = event.target.files[0];
            const statusDiv = document.getElementById('status');
            if (!file) return;

            statusDiv.className = '';
            statusDiv.innerText = `Memuat karakter ${file.name}...`;

            const reader = new FileReader();
            reader.readAsArrayBuffer(file);

            reader.onload = function (e) {
                const contents = e.target.result;
                const loader = new THREE.GLTFLoader();

                loader.parse(contents, '', (gltf) => {
                    if (characterModel) scene.remove(characterModel);

                    characterModel = gltf.scene;
                    scene.add(characterModel);

                    mixer = new THREE.AnimationMixer(characterModel);

                    // Posisikan kamera tepat di depan karakter
                    const box = new THREE.Box3().setFromObject(characterModel);
                    const center = box.getCenter(new THREE.Vector3());
                    controls.target.copy(center);

                    statusDiv.className = 'success';
                    statusDiv.innerText = `Karakter ${file.name} berhasil dimuat! Pilih preset animasi di bawah.`;
                }, (error) => {
                    console.error(error);
                    statusDiv.className = 'error';
                    statusDiv.innerText = 'Error: Gagal memuat file .glb.';
                });
            };
        }

        // --- 2. FETCH & RETARGET ANIMATION FROM VERCEL LIBRARY ---
        function fetchAndApplyAnimation(animUrl, animName) {
            const statusDiv = document.getElementById('status');
            if (!characterModel) {
                alert('Upload file .glb karakter kamu terlebih dahulu!');
                return;
            }

            statusDiv.className = '';
            statusDiv.innerText = `Mengunduh & mentransfer animasi: ${animName}...`;

            const loader = new THREE.GLTFLoader();
            loader.load(animUrl, (animGltf) => {
                const sourceAnimations = animGltf.animations;
                
                // Cari animasi berdasarkan nama klip
                let targetClip = sourceAnimations.find(a => a.name.toLowerCase().includes(animName.toLowerCase()));
                if (!targetClip) targetClip = sourceAnimations[0];

                if (targetClip) {
                    mixer.stopAllAction();
                    
                    // Kloning tracks animasi & transfer rotasi tulang ke karakter user
                    const retargetedClip = targetClip.clone();
                    
                    const action = mixer.clipAction(retargetedClip);
                    action.play();

                    statusDiv.className = 'success';
                    statusDiv.innerText = `Berhasil menerapkan animasi ${animName}!`;
                } else {
                    statusDiv.className = 'error';
                    statusDiv.innerText = `Klip animasi ${animName} tidak ditemukan.`;
                }
            }, undefined, (err) => {
                console.error(err);
                statusDiv.className = 'error';
                statusDiv.innerText = 'Error: Gagal mengunduh file animasi dari library Vercel.';
            });
        }

        // --- 3. RESET T-POSE ---
        function resetToTPose() {
            if (mixer) mixer.stopAllAction();
            document.getElementById('status').innerText = 'Karakter dikembalikan ke posisi awal (T-Pose).';
        }

        // --- 4. CONTROLS ---
        function togglePlayPause() {
            isPlaying = !isPlaying;
            document.getElementById('status').innerText = isPlaying ? 'Animasi diputar.' : 'Animasi di-pause.';
        }
    </script>
</body>
</html>
