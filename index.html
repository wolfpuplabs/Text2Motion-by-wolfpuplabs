<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Mixamo-Style Auto-Rigger UI</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        body { margin: 0; display: flex; height: 100vh; background: #121212; color: #fff; font-family: sans-serif; }
        #sidebar { width: 300px; padding: 20px; background: #1e1e1e; display: flex; flex-direction: column; gap: 10px; }
        #canvas-container { flex: 1; }
        button { padding: 10px; background: #4CAF50; border: none; color: #fff; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .step { font-size: 0.85rem; color: #aaa; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Auto-Rigger Web UI</h2>
        <input type="file" id="meshFile" accept=".glb, .gltf, .obj" onchange="loadMesh(event)">
        
        <div class="step">
            <p><strong>Langkah Penandaan Titik:</strong></p>
            <ol>
                <li>Klik <b>Dagu (Chin)</b></li>
                <li>Klik <b>Siku (Elbow)</b></li>
                <li>Klik <b>Lutut (Knee)</b></li>
                <li>Klik <b>Selangkangan (Groin)</b></li>
            </ol>
        </div>

        <button onclick="sendToAutoRigger()">🚀 Process Auto-Rigging</button>
        <div id="status">Status: Upload mesh tanpa tulang...</div>
    </div>

    <div id="canvas-container"></div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
        camera.position.set(0, 1.2, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(3, 10, 5);
        scene.add(dirLight);

        let currentMesh = null;
        const markers = [];
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function loadMesh(event) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.readAsArrayBuffer(file);
            reader.onload = (e) => {
                new THREE.GLTFLoader().parse(e.target.result, '', (gltf) => {
                    if (currentMesh) scene.remove(currentMesh);
                    currentMesh = gltf.scene;
                    scene.add(currentMesh);
                    document.getElementById('status').innerText = 'Klik pada model untuk menandai posisi sendi!';
                });
            };
        }

        // Fitur Klik Penanda Titik (Raycasting)
        window.addEventListener('pointerdown', (e) => {
            if (!currentMesh) return;
            
            mouse.x = (e.clientX - container.offsetLeft) / container.clientWidth * 2 - 1;
            mouse.y = -(e.clientY / container.clientHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(currentMesh, true);

            if (intersects.length > 0) {
                const point = intersects[0].point;
                
                // Buat Marker Bola Merah di titik klik
                const markerGeo = new THREE.SphereGeometry(0.03, 16, 16);
                const markerMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
                const marker = new THREE.Mesh(markerGeo, markerMat);
                marker.position.copy(point);
                scene.add(marker);

                markers.push({ x: point.x, y: point.y, z: point.z });
                document.getElementById('status').innerText = `Titik ${markers.length} ditandai!`;
            }
        });

        async function sendToAutoRigger() {
            if (markers.length < 4) {
                alert('Tandai minimal 4 titik sendi terlebih dahulu!');
                return;
            }

            document.getElementById('status').innerText = 'Mengirim koordinat titik ke server Auto-Rigging...';
            
            // Kirim data koordinat marker ke backend Kaggle
            console.log('Koordinat Sendi:', JSON.stringify(markers));
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
