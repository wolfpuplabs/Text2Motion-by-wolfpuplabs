<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesh2Motion WebUI (Mixamo Style)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; background-color: #121212; color: #ffffff; overflow: hidden; }
        
        #sidebar { width: 340px; background: #1e1e1e; padding: 20px; display: flex; flex-direction: column; gap: 15px; border-right: 1px solid #333; z-index: 10; overflow-y: auto; }
        h2 { color: #4CAF50; font-size: 1.2rem; margin-bottom: 5px; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 0.85rem; color: #aaa; }
        input[type="file"], select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 0.9rem; }
        button { width: 100%; padding: 12px; background: #4CAF50; border: none; font-weight: bold; color: white; border-radius: 6px; cursor: pointer; transition: 0.2s; margin-top: 5px; }
        button:hover { background: #45a049; }
        
        .anim-btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 5px; }
        .anim-btn { background: #333; font-size: 0.8rem; padding: 8px; font-weight: normal; margin: 0; }
        .anim-btn:hover { background: #555; }

        #status { font-size: 0.8rem; padding: 8px; border-radius: 4px; background: #222; color: #bbb; word-break: break-all; }
        .success { color: #4CAF50 !important; }
        .error { color: #f44336 !important; }

        #canvas-container { flex: 1; position: relative; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Mixamo-Style WebUI</h2>
        
        <!-- Upload Character -->
        <div class="input-group">
            <label for="charFile">1. Upload Character (.glb / .gltf)</label>
            <input type="file" id="charFile" accept=".glb, .gltf" onchange="uploadCharacter(event)">
        </div>

        <hr style="border-color: #333;">

        <!-- Preset Animations -->
        <div class="input-group">
            <label>2. Pilih Preset Animasi (Mixamo)</label>
            <div class="anim-btn-group">
                <button class="anim-btn" onclick="applyAnimation('walk')">🚶 Walk</button>
                <button class="anim-btn" onclick="applyAnimation('run')">🏃 Run</button>
                <button class="anim-btn" onclick="applyAnimation('dance')">💃 Dance</button>
                <button class="anim-btn" onclick="applyAnimation('idle')">🧍 Idle (T-Pose)</button>
            </div>
        </div>

        <hr style="border-color: #333;">

        <!-- Control Player -->
        <div class="input-group">
            <label>3. Controls</label>
            <button onclick="togglePlayPause()" style="background: #2196F3;">⏯ Play / Pause</button>
        </div>

        <div id="status">Status: Silakan upload karakter 3D (.glb)</div>
    </div>

    <div id="canvas-container"></div>

    <script>
        // --- THREE.JS SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
        camera.position.set(0, 1.5, 4);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1, 0);
        controls.update();

        // Lighting & Grid
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(3, 10, 5);
        scene.add(dirLight);

        const gridHelper = new THREE.GridHelper(10, 10, 0x444444, 0x222222);
        scene.add(gridHelper);

        let mixer = null;
        let currentModel = null;
        let activeAction = null;
        let isPlaying = true;
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (mixer && isPlaying) mixer.update(delta);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // --- UPLOAD CHARACTER ---
        function uploadCharacter(event) {
            const file = event.target.files[0];
            const statusDiv = document.getElementById('status');
            if (!file) return;

            statusDiv.className = '';
            statusDiv.innerText = `Memuat file ${file.name}...`;

            const reader = new FileReader();
            reader.readAsArrayBuffer(file);

            reader.onload = function (e) {
                const contents = e.target.result;
                const loader = new THREE.GLTFLoader();

                loader.parse(contents, '', (gltf) => {
                    if (currentModel) scene.remove(currentModel);

                    currentModel = gltf.scene;
                    scene.add(currentModel);

                    mixer = new THREE.AnimationMixer(currentModel);

                    // Jika karakter bawaan sudah punya animasi embedded
                    if (gltf.animations && gltf.animations.length > 0) {
                        activeAction = mixer.clipAction(gltf.animations[0]);
                        activeAction.play();
                        statusDiv.className = 'success';
                        statusDiv.innerText = `Karakter ${file.name} berhasil di-upload dengan animasi bawaan!`;
                    } else {
                        statusDiv.className = 'success';
                        statusDiv.innerText = `Karakter ${file.name} berhasil di-upload (T-Pose). Silakan pilih preset animasi!`;
                    }
                }, (error) => {
                    console.error(error);
                    statusDiv.className = 'error';
                    statusDiv.innerText = 'Error: Gagal membaca format file 3D.';
                });
            };
        }

        // --- APPLY PRESET ANIMATION (SIMULASI RETARGETING) ---
        function applyAnimation(type) {
            const statusDiv = document.getElementById('status');
            if (!currentModel || !mixer) {
                alert('Upload karakter .glb terlebih dahulu!');
                return;
            }

            statusDiv.innerText = `Menerapkan animasi: ${type.toUpperCase()}...`;

            // Jika karakter punya animasi internal dari Mixamo/GLTF
            if (currentModel.animations && currentModel.animations.length > 0) {
                if (activeAction) activeAction.stop();
                
                // Cari klip animasi yang sesuai atau jalankan klip pertama
                const clip = currentModel.animations[0];
                activeAction = mixer.clipAction(clip);
                activeAction.play();
                statusDiv.className = 'success';
                statusDiv.innerText = `Berhasil memutar gerakan ${type}!`;
            } else {
                statusDiv.className = 'error';
                statusDiv.innerText = `File .glb belum memiliki data skeleton animation. Silakan upload file .glb yang di-export dari Mixamo!`;
            }
        }

        // --- PLAY / PAUSE ---
        function togglePlayPause() {
            isPlaying = !isPlaying;
            document.getElementById('status').innerText = isPlaying ? 'Animasi diputar.' : 'Animasi di-pause.';
        }
    </script>
</body>
</html>
