<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesh2Motion WebUI (Custom Character)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; background-color: #121212; color: #ffffff; overflow: hidden; }
        
        /* Panel Kontrol Kiri */
        #sidebar { width: 340px; background: #1e1e1e; padding: 20px; display: flex; flex-direction: column; gap: 15px; border-right: 1px solid #333; z-index: 10; overflow-y: auto; }
        h2 { color: #4CAF50; font-size: 1.2rem; margin-bottom: 5px; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 0.85rem; color: #aaa; }
        input, textarea, button { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 0.9rem; }
        input[type="file"] { padding: 5px; background: #222; }
        textarea { resize: vertical; height: 70px; }
        button { background: #4CAF50; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 5px; }
        button:hover { background: #45a049; }
        button:disabled { background: #555; cursor: not-allowed; }
        
        /* Status Display */
        #status { font-size: 0.8rem; padding: 8px; border-radius: 4px; background: #222; color: #bbb; word-break: break-all; }
        .success { color: #4CAF50 !important; }
        .error { color: #f44336 !important; }

        /* Area Canvas 3D */
        #canvas-container { flex: 1; position: relative; width: 100%; height: 100%; }
        #loading-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); padding: 20px; border-radius: 8px; display: none; text-align: center; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Mesh2Motion WebUI</h2>
        
        <!-- 1. Upload Character Sendiri -->
        <div class="input-group">
            <label for="charFile">Upload Character (.glb / .gltf)</label>
            <input type="file" id="charFile" accept=".glb, .gltf" onchange="uploadCharacter(event)">
        </div>

        <hr style="border-color: #333;">

        <!-- 2. Form AI Generator -->
        <div class="input-group">
            <label for="apiUrl">Localtunnel URL (Kaggle)</label>
            <input type="text" id="apiUrl" placeholder="https://xxxx.loca.lt">
        </div>

        <div class="input-group">
            <label for="prompt">Text Prompt Gerakan</label>
            <textarea id="prompt" placeholder="a person walking happily..."></textarea>
        </div>

        <button id="generateBtn" onclick="generateMotion()">Generate Motion</button>

        <div id="status">Status: Siap (Upload karakter atau masukkan URL Kaggle)</div>
    </div>

    <div id="canvas-container">
        <div id="loading-overlay">⏳ Memproses AI & Memuat Model 3D...</div>
    </div>

    <script>
        // --- SETUP THREE.JS (VIEWER 3D) ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
        camera.position.set(0, 1.5, 4);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1, 0);
        controls.update();

        // Pencahayaan & Grid Floor
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(3, 10, 5);
        scene.add(dirLight);

        const gridHelper = new THREE.GridHelper(10, 10, 0x444444, 0x222222);
        scene.add(gridHelper);

        let mixer = null;
        let currentModel = null;
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // --- FUNGSI UPLOAD CHARACTER LOKAL ---
        function uploadCharacter(event) {
            const file = event.target.files[0];
            const statusDiv = document.getElementById('status');

            if (!file) return;

            statusDiv.className = '';
            statusDiv.innerText = `Status: Memuat file ${file.name}...`;

            const reader = new FileReader();
            reader.readAsArrayBuffer(file);

            reader.onload = function (e) {
                const contents = e.target.result;
                const loader = new THREE.GLTFLoader();

                loader.parse(contents, '', (gltf) => {
                    if (currentModel) scene.remove(currentModel);

                    currentModel = gltf.scene;
                    scene.add(currentModel);

                    // Set animasi jika file yang diupload sudah ada gerakannya
                    if (gltf.animations && gltf.animations.length > 0) {
                        mixer = new THREE.AnimationMixer(currentModel);
                        const action = mixer.clipAction(gltf.animations[0]);
                        action.play();
                    }

                    statusDiv.className = 'success';
                    statusDiv.innerText = `Status: Karakter ${file.name} berhasil di-upload!`;
                }, (error) => {
                    console.error(error);
                    statusDiv.className = 'error';
                    statusDiv.innerText = 'Status Error: Gagal membaca file 3D.';
                });
            };
        }

        // --- GENERATE MOTION DARI KAGGLE ---
        async function generateMotion() {
            let baseUrl = document.getElementById('apiUrl').value.trim();
            const promptText = document.getElementById('prompt').value.trim();
            const statusDiv = document.getElementById('status');
            const btn = document.getElementById('generateBtn');
            const loading = document.getElementById('loading-overlay');

            if (!baseUrl || !promptText) {
                alert('Mohon isi URL Localtunnel dan Text Prompt!');
                return;
            }

            if (!baseUrl.startsWith('http')) baseUrl = 'https://' + baseUrl;
            if (baseUrl.endsWith('/')) baseUrl = baseUrl.slice(0, -1);

            statusDiv.className = '';
            statusDiv.innerText = 'Status: Mengirim request ke Kaggle...';
            btn.disabled = true;
            loading.style.display = 'block';

            try {
                const response = await fetch(`${baseUrl}/generate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Bypass-Tunnel-Remainder': 'true'
                    },
                    body: JSON.stringify({ prompt: promptText })
                });

                if (!response.ok) throw new Error(`HTTP Error status: ${response.status}`);

                const data = await response.json();
                const gltfUrl = data.file_url.startsWith('http') ? data.file_url : `${baseUrl}${data.file_url}`;
                
                statusDiv.className = 'success';
                statusDiv.innerText = 'Status: Berhasil! Memuat animasi AI...';

                loadGLTFModel(gltfUrl);

            } catch (err) {
                console.error(err);
                statusDiv.className = 'error';
                statusDiv.innerText = `Status Error: ${err.message}`;
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }

        function loadGLTFModel(url) {
            const loader = new THREE.GLTFLoader();
            if (currentModel) scene.remove(currentModel);

            loader.load(url, (gltf) => {
                currentModel = gltf.scene;
                scene.add(currentModel);

                if (gltf.animations && gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(currentModel);
                    const action = mixer.clipAction(gltf.animations[0]);
                    action.play();
                }
            });
        }
    </script>
</body>
</html>
