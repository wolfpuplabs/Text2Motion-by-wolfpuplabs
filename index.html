<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mixamo Auto-Rigger iPad Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { margin: 0; display: flex; height: 100vh; background: #121212; color: #fff; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
        #sidebar { width: 300px; min-width: 300px; padding: 15px; background: #1e1e1e; display: flex; flex-direction: column; gap: 10px; z-index: 20; border-right: 1px solid #333; overflow-y: auto; }
        #canvas-container { flex: 1; position: relative; width: 100%; height: 100vh; touch-action: none; }
        .input-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 0.8rem; color: #aaa; }
        input[type="text"], input[type="file"] { padding: 8px; background: #2a2a2a; border: 1px solid #333; color: #fff; border-radius: 4px; font-size: 0.85rem; }
        button { padding: 10px; background: #4CAF50; border: none; color: #fff; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .btn-sec { background: #333; font-size: 0.8rem; padding: 8px; margin-top: 4px; }
        .btn-danger { background: #f44336; margin-top: 5px; }
        #status { font-size: 0.85rem; padding: 10px; background: #222; color: #ffeb3b; border-radius: 4px; word-break: break-all; font-weight: bold; }
        .step-list { font-size: 0.8rem; color: #ccc; background: #262626; padding: 10px; border-radius: 4px; }
        .btn-group { display: flex; gap: 5px; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h3>Auto-Rigger iPad Studio</h3>
        
        <div class="input-group">
            <label>Backend Localtunnel URL (Kaggle)</label>
            <input type="text" id="apiUrl" value="https://fuzzy-crabs-heal.loca.lt">
        </div>

        <div class="input-group">
            <label>1. Upload File 3D Mesh</label>
            <input type="file" id="meshFile" accept=".glb, .gltf" onchange="loadMesh(event)">
        </div>

        <div class="btn-group">
            <button class="btn-sec" style="flex:1" id="autoRotateBtn" onclick="toggleAutoRotate()">🔄 Auto Rotate</button>
            <button class="btn-sec" style="flex:1" onclick="resetCamera()">👁️ Reset Kamera</button>
        </div>
        
        <div class="step-list">
            <b>Urutan Titik Penandaan (Tap Karakter):</b>
            <ol style="margin-left:15px; margin-top:3px;">
                <li>Dagu (Chin)</li>
                <li>Siku (Elbow)</li>
                <li>Lutut (Knee)</li>
                <li>Selangkangan (Groin)</li>
            </ol>
            <button class="btn-danger" style="width:100%" onclick="resetMarkers()">Reset Semua Titik</button>
        </div>

        <button id="rigBtn" onclick="sendToAutoRigger()">🚀 Process Auto-Rigging</button>
        <div id="status">Status: Upload File .GLB Kamu</div>
    </div>

    <div id="canvas-container"></div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
        camera.position.set(0, 1.2, 3.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(2, 5, 5);
        scene.add(dirLight);

        let rawFile = null;
        let currentMesh = null;
        const meshTargets = [];
        const markers = [];
        const markerObjects = [];
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // Variabel untuk membedakan TAP dengan SWIPE/ROTATE
        let startX = 0, startY = 0;

        function toggleAutoRotate() {
            controls.autoRotate = !controls.autoRotate;
            document.getElementById('autoRotateBtn').innerText = controls.autoRotate ? "🔄 Auto Rotate: ON" : "⏸️ Auto Rotate: OFF";
        }

        function loadMesh(event) {
            rawFile = event.target.files[0];
            if (!rawFile) return;

            resetMarkers();
            meshTargets.length = 0;

            const reader = new FileReader();
            reader.readAsArrayBuffer(rawFile);
            reader.onload = (e) => {
                new THREE.GLTFLoader().parse(e.target.result, '', (gltf) => {
                    if (currentMesh) scene.remove(currentMesh);
                    currentMesh = gltf.scene;

                    // Update seluruh matriks transformasi anak mesh
                    currentMesh.updateMatrixWorld(true);

                    currentMesh.traverse((child) => {
                        if (child.isMesh) {
                            meshTargets.push(child);
                        }
                    });

                    const box = new THREE.Box3().setFromObject(currentMesh);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());

                    currentMesh.position.x -= center.x;
                    currentMesh.position.y -= box.min.y;
                    currentMesh.position.z -= center.z;

                    // Perbarui matriks setelah posisi diubah
                    currentMesh.updateMatrixWorld(true);

                    scene.add(currentMesh);

                    controls.target.set(0, size.y / 2, 0);
                    camera.position.set(0, size.y / 2, size.y * 2.2);
                    controls.update();

                    document.getElementById('status').innerText = 'Tap pada karakter untuk menandai: 1. Dagu (Chin)';
                });
            };
        }

        function resetCamera() {
            if (currentMesh) {
                const box = new THREE.Box3().setFromObject(currentMesh);
                const size = box.getSize(new THREE.Vector3());
                controls.target.set(0, size.y / 2, 0);
                camera.position.set(0, size.y / 2, size.y * 2.2);
                controls.update();
            }
        }

        // Catat posisi awal sentuhan
        renderer.domElement.addEventListener('pointerdown', (e) => {
            startX = e.clientX;
            startY = e.clientY;
        });

        // Eksekusi penandaan HANYA jika murni TAP (jarak geser < 5px)
        renderer.domElement.addEventListener('pointerup', (e) => {
            if (!currentMesh || markers.length >= 4 || meshTargets.length === 0) return;

            const dist = Math.hypot(e.clientX - startX, e.clientY - startY);
            if (dist > 5) return; // Menggeser layar untuk memutar kamera, abaikan!

            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            
            // Panggil updateMatrixWorld sebelum Raycasting
            currentMesh.updateMatrixWorld(true);
            const intersects = raycaster.intersectObjects(meshTargets, true);

            if (intersects.length > 0) {
                const hitPoint = intersects[0].point;

                // Buat Bola Penanda Merah Presisi
                const markerGeo = new THREE.SphereGeometry(0.04, 16, 16);
                const markerMat = new THREE.MeshBasicMaterial({ 
                    color: 0xff0000, 
                    depthTest: false,
                    transparent: false 
                });
                const marker = new THREE.Mesh(markerGeo, markerMat);
                marker.position.copy(hitPoint);
                marker.renderOrder = 9999;

                scene.add(marker);
                markerObjects.push(marker);
                markers.push({ x: hitPoint.x, y: hitPoint.y, z: hitPoint.z });

                // Matikan rotasi otomatis jika sedang aktif
                controls.autoRotate = false;

                const names = ["Dagu", "Siku", "Lutut", "Selangkangan"];
                if (markers.length < 4) {
                    document.getElementById('status').innerText = `🔴 ${names[markers.length - 1]} Ditandai! Selanjutnya: ${names[markers.length]}`;
                } else {
                    document.getElementById('status').innerText = '🎉 Semua 4 titik ditandai! Klik Process Auto-Rigging.';
                }
            }
        });

        function resetMarkers() {
            markerObjects.forEach(m => scene.remove(m));
            markerObjects.length = 0;
            markers.length = 0;
            document.getElementById('status').innerText = 'Titik di-reset. Tap ulang dari Dagu.';
        }

        async function sendToAutoRigger() {
            let baseUrl = document.getElementById('apiUrl').value.trim();
            const statusDiv = document.getElementById('status');

            if (!baseUrl || !rawFile) {
                alert('Isi URL Localtunnel dan Upload file .glb terlebih dahulu!');
                return;
            }

            if (markers.length < 4) {
                alert('Harap tandai keempat titik (Dagu, Siku, Lutut, Selangkangan) terlebih dahulu!');
                return;
            }

            statusDiv.innerText = '⏳ Mengirim ke Blender Backend (~15-30 detik)...';

            const formData = new FormData();
            formData.append('file', rawFile);
            formData.append('markers', JSON.stringify(markers));

            try {
                const response = await fetch(`${baseUrl}/auto-rig`, {
                    method: 'POST',
                    headers: { 'Bypass-Tunnel-Remainder': 'true' },
                    body: formData
                });

                if (!response.ok) throw new Error(`Server Error: ${response.status}`);

                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);

                statusDiv.innerText = '✅ Auto-Rig Selesai! Memuat hasil GLB...';

                resetMarkers();
                new THREE.GLTFLoader().load(blobUrl, (gltf) => {
                    if (currentMesh) scene.remove(currentMesh);
                    currentMesh = gltf.scene;
                    scene.add(currentMesh);
                });

            } catch (err) {
                statusDiv.innerText = `Error: ${err.message}`;
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
    </script>
</body>
</html>
