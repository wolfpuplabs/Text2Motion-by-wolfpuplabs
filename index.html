<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T2M & Auto Rigger (Kaggle Edition)</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #fff; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .panel {
            position: absolute; background: rgba(30, 30, 30, 0.85); padding: 15px; border-radius: 12px;
            border: 1px solid #444; box-shadow: 0 8px 16px rgba(0,0,0,0.5); backdrop-filter: blur(8px); z-index: 10;
        }

        #left-panel { top: 20px; left: 20px; width: 320px; max-height: 90vh; overflow-y: auto; }
        #right-panel { top: 20px; right: 20px; width: 280px; }
        
        h3 { margin-top: 0; color: #4CAF50; font-size: 1.1rem; margin-bottom: 10px; border-bottom: 1px solid #444; padding-bottom: 8px; }
        label { display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 5px; margin-top: 10px; }
        
        input[type="text"], textarea, input[type="file"] {
            width: 100%; padding: 8px; background: #2a2a2a; border: 1px solid #555; 
            color: white; border-radius: 4px; box-sizing: border-box; font-size: 0.85rem;
        }
        input[type="file"] { padding: 4px; background: transparent; border: 1px dashed #555; cursor: pointer; }
        textarea { resize: vertical; min-height: 50px; }
        
        button {
            width: 100%; margin-top: 10px; padding: 10px; background: #4CAF50; color: white; 
            border: none; font-weight: bold; border-radius: 4px; cursor: pointer; transition: 0.2s;
        }
        button:hover { background: #45a049; }
        
        /* Transform Tools */
        .tool-btn { background: #333; border: 1px solid #555; margin-top: 5px; width: 31%; display: inline-block; padding: 8px 0; font-size: 0.8rem; color: #fff;}
        .tool-btn:hover { background: #444; }
        .tool-btn.active { background: #2196F3; border-color: #0b7dda; }
        .tool-row { display: flex; justify-content: space-between; }
        
        /* Auto Rigger Tools */
        .rig-btn { background: #E91E63; }
        .rig-btn:hover { background: #C2185B; }
        .rig-btn.active { background: #9C27B0; box-shadow: 0 0 10px #9C27B0; }
        
        /* Playback & Progress */
        #progress-container { width: 100%; background: #222; border-radius: 4px; margin-top: 10px; border: 1px solid #444; overflow: hidden; display: none; }
        #progress-bar { width: 0%; height: 8px; background: #4CAF50; transition: width 0.4s ease; }
        
        #playback-controls { display: none; margin-top: 15px; background: #1a1a1a; padding: 10px; border-radius: 6px; border: 1px solid #333; }
        .play-row { display: flex; align-items: center; gap: 10px; }
        #btn-play { flex: 0 0 70px; background: #2196F3; margin: 0; padding: 6px; }
        #anim-slider { flex: 1; cursor: pointer; accent-color: #4CAF50; }
        
        .download-btn { background: #E91E63; display: none; margin-top: 10px; }
        .download-btn:hover { background: #C2185B; }
        
        #status-box { margin-top: 15px; padding: 10px; border-radius: 4px; background: #222; border: 1px solid #444; font-size: 0.8rem; color: #4CAF50; word-wrap: break-word; }
        .error { color: #ff5252 !important; border-color: #ff5252 !important; }

        #crosshair { 
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
            background: red; border-radius: 50%; transform: translate(-50%, -50%);
            z-index: 100; pointer-events: none; display: none;
        }
    </style>
    
    <!-- Three.js Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="crosshair"></div>

    <!-- Panel Kiri: Text-to-Motion -->
    <div class="panel" id="left-panel">
        <h3>Text-to-Motion WebUI</h3>
        
        <label>1. Upload 3D Character (.glb/.gltf)</label>
        <input type="file" id="model-upload" accept=".glb,.gltf">
        
        <label>2. Localtunnel URL (dari Kaggle)</label>
        <input type="text" id="api-url" placeholder="https://xxxx.loca.lt">

        <label>3. Text Prompt</label>
        <textarea id="prompt" placeholder="A person walking happily..."></textarea>
        
        <button onclick="generateMotionAPI()">Generate Motion</button>
        
        <div id="progress-container"><div id="progress-bar"></div></div>

        <!-- Playback Controls -->
        <div id="playback-controls">
            <div class="play-row">
                <button id="btn-play" onclick="togglePlay()">⏸ Pause</button>
                <input type="range" id="anim-slider" min="0" max="100" value="0">
            </div>
        </div>

        <button id="btn-download" class="download-btn" onclick="downloadModel()">↓ Download Animated .GLB</button>
        <div id="status-box">Status: Ready.</div>
    </div>

    <!-- Panel Kanan: Tools & Rigging -->
    <div class="panel" id="right-panel">
        <h3>Transform Editor</h3>
        <div class="tool-row">
            <button class="tool-btn active" id="btn-translate" onclick="setTransformMode('translate')">Move</button>
            <button class="tool-btn" id="btn-rotate" onclick="setTransformMode('rotate')">Rotate</button>
            <button class="tool-btn" id="btn-scale" onclick="setTransformMode('scale')">Scale</button>
        </div>
        <button class="tool-btn" style="width: 100%; margin-top: 5px;" onclick="resetTransform()">Reset Transform</button>

        <h3 style="margin-top: 25px;">Auto Rigger Points</h3>
        <button class="rig-btn" id="btn-rig" onclick="toggleRiggingMode()">Start Marker Placement</button>
        <div id="rig-status" style="margin-top: 10px; font-size: 0.85rem; color: #FFC107;"></div>
        <div style="display:flex; gap: 5px; margin-top: 10px;">
            <button class="tool-btn" style="width: 50%;" onclick="clearMarkers()">Clear</button>
            <button class="tool-btn" style="width: 50%; background: #FF9800; border: none;" onclick="exportRigData()">Export JSON</button>
        </div>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2a2b2e);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.5, 4);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
        orbitControls.target.set(0, 1, 0); orbitControls.update();

        scene.add(new THREE.GridHelper(20, 20, 0x555555, 0x333333));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(3, 10, 10); scene.add(dirLight);
        scene.add(new THREE.AmbientLight(0x606060));

        const transformControl = new THREE.TransformControls(camera, renderer.domElement);
        transformControl.addEventListener('dragging-changed', (e) => orbitControls.enabled = !e.value);
        scene.add(transformControl);

        let currentModel = null, mixer = null, clock = new THREE.Clock();
        let currentAction = null, isPlaying = false, skeletonHelper = null;
        const loader = new THREE.GLTFLoader();

        function updateStatus(msg, isError = false) { 
            const box = document.getElementById('status-box');
            box.innerText = `Status: ${msg}`; 
            box.className = isError ? 'error' : '';
        }

        function loadModel(url) {
            if(currentModel) {
                transformControl.detach();
                scene.remove(currentModel);
                if(skeletonHelper) scene.remove(skeletonHelper);
            }
            if(mixer) { mixer.stopAllAction(); mixer = null; }
            
            updateStatus("Memuat model...");
            loader.load(url, (gltf) => {
                currentModel = gltf.scene;
                scene.add(currentModel);
                mixer = new THREE.AnimationMixer(currentModel);
                skeletonHelper = new THREE.SkeletonHelper(currentModel);
                scene.add(skeletonHelper);
                transformControl.attach(currentModel);
                updateStatus("Model loaded! Siap dianimasikan.");
            }, undefined, () => updateStatus("Error memuat model.", true));
        }
        
        loadModel('https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/RiggedFigure/glTF/RiggedFigure.gltf');
        
        document.getElementById('model-upload').addEventListener('change', (e) => {
            if (e.target.files[0]) loadModel(URL.createObjectURL(e.target.files[0]));
        });

        function setTransformMode(mode) {
            transformControl.setMode(mode);
            document.querySelectorAll('#right-panel .tool-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${mode}`).classList.add('active');
        }
        function resetTransform() {
            if(currentModel) {
                currentModel.position.set(0,0,0);
                currentModel.rotation.set(0,0,0);
                currentModel.scale.set(1,1,1);
            }
        }

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let isRiggingMode = false;
        const rigPoints = ['Chin', 'Left Wrist', 'Right Wrist', 'Left Knee', 'Right Knee', 'Left Ankle', 'Right Ankle'];
        let rigIndex = 0, placedMarkers = {}, markerMeshes = [];

        function toggleRiggingMode() {
            isRiggingMode = !isRiggingMode;
            const btn = document.getElementById('btn-rig');
            
            if (isRiggingMode) {
                transformControl.detach();
                btn.classList.add('active');
                btn.innerText = "Cancel Placement";
                document.getElementById('crosshair').style.display = 'block';
                updateRigUI();
            } else {
                btn.classList.remove('active');
                btn.innerText = "Start Marker Placement";
                document.getElementById('rig-status').innerText = "";
                document.getElementById('crosshair').style.display = 'none';
                if(currentModel) transformControl.attach(currentModel);
            }
        }

        function updateRigUI() {
            if (rigIndex < rigPoints.length) {
                document.getElementById('rig-status').innerText = `Klik area: ${rigPoints[rigIndex]}`;
            } else {
                document.getElementById('rig-status').innerText = "Semua titik selesai dipasang!";
                toggleRiggingMode();
            }
        }

        window.addEventListener('mousedown', (event) => {
            if (!isRiggingMode || rigIndex >= rigPoints.length || event.target.tagName !== 'CANVAS') return;
            
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObject(currentModel, true);
            if (intersects.length > 0) {
                const hit = intersects[0].point;
                const marker = new THREE.Mesh(
                    new THREE.SphereGeometry(0.04, 16, 16),
                    new THREE.MeshBasicMaterial({ color: 0xFF0000, depthTest: false })
                );
                marker.position.copy(hit);
                scene.add(marker);
                markerMeshes.push(marker);
                
                placedMarkers[rigPoints[rigIndex]] = { x: hit.x, y: hit.y, z: hit.z };
                rigIndex++;
                updateRigUI();
            }
        });

        function clearMarkers() {
            markerMeshes.forEach(m => scene.remove(m));
            markerMeshes = []; placedMarkers = {}; rigIndex = 0;
            if(isRiggingMode) updateRigUI();
        }

        function exportRigData() {
            if(Object.keys(placedMarkers).length === 0) { alert("Belum ada marker!"); return; }
            console.log("JSON Rig Markers:", JSON.stringify(placedMarkers, null, 2));
            alert("Data marker (JSON) dicetak di Console Log Browser Anda.");
        }

        // ==========================================
        // API FETCH DARI GOLANG KIMODO
        // ==========================================
        async function generateMotionAPI() {
            if (!currentModel || !mixer) return;
            
            const promptText = document.getElementById('prompt').value;
            let baseUrl = document.getElementById('api-url').value;
            
            // Bersihkan URL dari slash di akhir jika ada
            if(baseUrl.endsWith('/')) baseUrl = baseUrl.slice(0, -1);
            
            // Pastikan API endpoint kimodo yang dituju benar. (Biasanya /generate atau disesuaikan dengan demo go run)
            const apiUrl = `${baseUrl}/generate`; // Ubah '/generate' jika routing kimodo berbeda

            if (!promptText) { alert('Isi prompt terlebih dahulu!'); return; }
            if (!baseUrl) { alert('Masukkan URL Localtunnel dari Kaggle!'); return; }
            
            const progContainer = document.getElementById('progress-container');
            const progBar = document.getElementById('progress-bar');
            
            document.getElementById('playback-controls').style.display = 'none';
            document.getElementById('btn-download').style.display = 'none';
            if(currentAction) currentAction.stop();
            
            progContainer.style.display = 'block';
            progBar.style.width = '20%';
            updateStatus("Menghubungi API Kaggle...");

            try {
                // Header Bypass-Tunnel-Reminder ini WAJIB ada!
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Bypass-Tunnel-Reminder': 'true' // Mengakali blokir peringatan localtunnel
                    },
                    body: JSON.stringify({ prompt: promptText })
                });

                progBar.style.width = '70%';
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

                const data = await response.json();
                updateStatus("Menerapkan animasi...");
                progBar.style.width = '90%';

                applyRetargeting(data);

                progBar.style.width = '100%';
                updateStatus("Selesai! Animasi berhasil diterapkan.");
                
                document.getElementById('playback-controls').style.display = 'block';
                document.getElementById('btn-download').style.display = 'block';
                setTimeout(() => { progContainer.style.display = 'none'; }, 1000);

            } catch (error) {
                console.error(error);
                progBar.style.width = '0%';
                updateStatus(`Gagal: Cek console! Pastikan URL benar.`, true);
            }
        }

        function applyRetargeting(apiData) {
            console.log("Data API Diterima:", apiData);
            // Ganti ini dengan parser BVH/JSON asli dari Kimodo nanti
            const tracks = [];
            let boneCount = 0;
            currentModel.traverse((child) => {
                if (child.isBone && boneCount < 8) {
                    const times = [0, 1, 2];
                    const q1 = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, 0, 0));
                    const q2 = new THREE.Quaternion().setFromEuler(new THREE.Euler(0.3, 0, 0.3));
                    const values = [ q1.x, q1.y, q1.z, q1.w, q2.x, q2.y, q2.z, q2.w, q1.x, q1.y, q1.z, q1.w ];
                    tracks.push(new THREE.QuaternionKeyframeTrack(child.name + '.quaternion', times, values));
                    boneCount++;
                }
            });

            const clip = new THREE.AnimationClip('GeneratedMotion', 2, tracks);
            currentAction = mixer.clipAction(clip);
            currentAction.play();
            
            isPlaying = true;
            document.getElementById('btn-play').innerText = "⏸ Pause";
            clock.getDelta(); 
        }

        function togglePlay() {
            if(!currentAction) return;
            isPlaying = !isPlaying;
            document.getElementById('btn-play').innerText = isPlaying ? "⏸ Pause" : "▶ Play";
            if (isPlaying) clock.getDelta();
        }

        const slider = document.getElementById('anim-slider');
        slider.addEventListener('input', (e) => {
            if (!currentAction) return;
            isPlaying = false;
            document.getElementById('btn-play').innerText = "▶ Play";
            currentAction.time = (e.target.value / 100) * currentAction.getClip().duration;
            mixer.update(0);
        });

        function downloadModel() {
            if (!currentModel) return;
            updateStatus("Mengekspor model...");
            const exporter = new THREE.GLTFExporter();
            exporter.parse(currentModel, (gltf) => {
                const blob = new Blob([JSON.stringify(gltf)], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'animated_t2m.gltf';
                link.click();
                URL.revokeObjectURL(url);
                updateStatus("Download berhasil!");
            }, { trs: true, animations: [currentAction.getClip()] });
        }

        function animate() {
            requestAnimationFrame(animate);
            if (mixer && isPlaying && currentAction) {
                mixer.update(clock.getDelta());
                const progress = (currentAction.time / currentAction.getClip().duration) * 100;
                slider.value = progress;
            }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
